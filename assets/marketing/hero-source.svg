<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="brandSoft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.14"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#17121f" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#f7f5fb"/>
  <circle cx="1080" cy="70" r="260" fill="url(#brandSoft)"/>
  <circle cx="60" cy="600" r="220" fill="url(#brandSoft)"/>

  <!-- brand mark -->
  <g transform="translate(64,56)">
    <rect width="46" height="46" rx="12" fill="url(#brand)"/>
    <path d="M11 17 V11 H17" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M35 11 H29" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M35 11 V17" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M11 29 V35 H17" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M35 35 H29" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M35 35 V29" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="18" y="18" width="10" height="10" rx="2" fill="#fff"/>
  </g>
  <text x="122" y="88" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-weight="700" font-size="26" fill="#17121f" letter-spacing="-0.3">Extractify</text>

  <!-- headline -->
  <text x="64" y="200" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-weight="700" font-size="46" fill="#17121f">
    <tspan x="64" dy="0">Turn any screenshot</tspan>
    <tspan x="64" dy="56">into a real table.</tspan>
  </text>
  <text x="64" y="332" font-family="IBM Plex Sans, -apple-system, Segoe UI, sans-serif" font-size="19" fill="#57506b">
    <tspan x="64" dy="0">Select a region — or right-click any image — and an on-device</tspan>
    <tspan x="64" dy="28">OCR engine rebuilds real rows and columns. Nothing leaves your</tspan>
    <tspan x="64" dy="28">computer.</tspan>
  </text>

  <!-- stats row -->
  <g font-family="IBM Plex Mono, ui-monospace, monospace">
    <text x="64" y="450" font-size="22" font-weight="700" fill="#17121f">EN + HE</text>
    <text x="64" y="472" font-size="13" fill="#5b5570">OCR languages</text>
    <text x="220" y="450" font-size="22" font-weight="700" fill="#17121f">0</text>
    <text x="220" y="472" font-size="13" fill="#5b5570">servers your data touches</text>
    <text x="440" y="450" font-size="22" font-weight="700" fill="#17121f">100%</text>
    <text x="440" y="472" font-size="13" fill="#5b5570">offline recognition</text>
  </g>

  <!-- before / after mockup -->
  <g transform="translate(640,150)" filter="url(#soft)">
    <!-- before panel -->
    <g>
      <rect width="230" height="200" rx="14" fill="#ffffff" stroke="#ddd7ef"/>
      <rect x="0" y="0" width="230" height="34" rx="14" fill="#ffffff" stroke="#ddd7ef"/>
      <rect x="0" y="17" width="230" height="17" fill="#ffffff"/>
      <circle cx="20" cy="17" r="4" fill="#c3bbe0"/>
      <circle cx="34" cy="17" r="4" fill="#c3bbe0"/>
      <circle cx="48" cy="17" r="4" fill="#c3bbe0"/>
      <!-- capture brackets -->
      <g stroke="#4F46E5" stroke-width="2.6" fill="none" stroke-linecap="round">
        <path d="M22 58 V50 H30"/>
        <path d="M200 50 H208 V58"/>
        <path d="M22 148 V156 H30"/>
        <path d="M208 148 V156 H200"/>
      </g>
      <rect x="22" y="50" width="186" height="106" rx="4" fill="none" stroke="#4F46E5" stroke-width="1.4" stroke-dasharray="5 5" opacity="0.55"/>
      <!-- messy text lines -->
      <rect x="38" y="66" width="120" height="9" rx="4" fill="#c3bbe0"/>
      <rect x="38" y="86" width="150" height="9" rx="4" fill="#ddd7ef"/>
      <rect x="38" y="106" width="90" height="9" rx="4" fill="#c3bbe0"/>
      <rect x="38" y="126" width="130" height="9" rx="4" fill="#ddd7ef"/>
    </g>

    <!-- arrow -->
    <g transform="translate(248,90)">
      <path d="M0 12 H40 M28 0 L40 12 L28 24" stroke="url(#brand)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- after panel -->
    <g transform="translate(310,0)">
      <rect width="230" height="200" rx="14" fill="#ffffff" stroke="#ddd7ef"/>
      <rect x="0" y="0" width="230" height="34" rx="14" fill="#ffffff" stroke="#ddd7ef"/>
      <circle cx="20" cy="17" r="4" fill="#c3bbe0"/>
      <circle cx="34" cy="17" r="4" fill="#c3bbe0"/>
      <circle cx="48" cy="17" r="4" fill="#c3bbe0"/>
      <!-- table grid -->
      <g transform="translate(20,50)">
        <rect width="190" height="30" rx="4" fill="url(#brandSoft)"/>
        <rect y="38" width="190" height="24" fill="none"/>
        <line x1="0" y1="38" x2="190" y2="38" stroke="#ddd7ef"/>
        <line x1="0" y1="66" x2="190" y2="66" stroke="#ddd7ef"/>
        <line x1="0" y1="94" x2="190" y2="94" stroke="#ddd7ef"/>
        <line x1="63" y1="0" x2="63" y2="94" stroke="#ddd7ef"/>
        <line x1="127" y1="0" x2="127" y2="94" stroke="#ddd7ef"/>
        <rect x="10" y="46" width="42" height="8" rx="3" fill="#57506b"/>
        <rect x="74" y="46" width="34" height="8" rx="3" fill="#57506b"/>
        <rect x="138" y="46" width="40" height="8" rx="3" fill="#57506b"/>
        <rect x="10" y="74" width="36" height="8" rx="3" fill="#8a83a3"/>
        <rect x="74" y="74" width="30" height="8" rx="3" fill="#8a83a3"/>
        <rect x="138" y="74" width="44" height="8" rx="3" fill="#8a83a3"/>
      </g>
      <g transform="translate(196,16)">
        <circle r="14" fill="#16a34a"/>
        <path d="M-6 0 L-2 5 L7 -6" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>

  <text x="640" y="392" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#5b5570">open source · runs fully offline</text>
</svg>
